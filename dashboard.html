<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo Automation Dashboard</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c2030; --muted:#6b7280; --line:#e5e7eb; --brand:#4f46e5; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1220; --card:#181c2e; --text:#e8eaf6; --muted:#9aa1b9; --line:#2a3050; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:24px 16px 60px; display:grid; gap:16px; }
  h1 { margin:0 0 4px; font-size:22px; } h2 { margin:0 0 12px; font-size:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--text); font:inherit; }
  textarea { min-height:140px; resize:vertical; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:640px){ .grid{grid-template-columns:1fr;} }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:16px; text-align:center; cursor:pointer; color:var(--muted); min-height:120px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; }
  .drop.over { border-color:var(--brand); }
  .drop img { max-height:110px; max-width:100%; border-radius:6px; }
  button { background:var(--brand); color:#fff; border:0; padding:10px 16px; border-radius:8px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .msg { margin-top:10px; font-size:13px; } .msg.ok{color:var(--ok);} .msg.err{color:var(--err);}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td img { width:36px; height:36px; object-fit:cover; border-radius:6px; }
  .pill { padding:2px 8px; border-radius:999px; font-size:11px; background:var(--line); }
  .pill.pending{background:#fde68a;color:#78350f;} .pill.claimed,.pill.running{background:#bfdbfe;color:#1e3a8a;}
  .pill.done{background:#bbf7d0;color:#14532d;} .pill.failed{background:#fecaca;color:#7f1d1d;}
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .gallery a { display:block; } .gallery img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .gallery small { display:block; color:var(--muted); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Logo Automation Dashboard</h1>
    <div class="muted">Add a logo + prompts here. The extension picks them up automatically and runs them.</div>
  </div>

  <section class="card">
    <h2>New job</h2>
    <label>License key (must match the key activated in the extension)</label>
    <input id="license" type="text" placeholder="Your license key" autocomplete="off" />
    <div class="grid">
      <div>
        <label>Business label</label>
        <input id="label" type="text" placeholder="Acme Co" />
      </div>
      <div>
        <label>Save folder</label>
        <input id="folder" type="text" placeholder="acme-co" />
      </div>
    </div>
    <label>Logo / image</label>
    <div class="drop" id="drop">
      <input id="file" type="file" accept="image/*" hidden />
      <div id="drop-empty">Click or drop an image here</div>
      <img id="preview" alt="" hidden />
    </div>
    <label>Prompts (one per line)</label>
    <textarea id="prompts" placeholder="One prompt per line…"></textarea>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--text);font-size:13px;">
      <input id="sync" type="checkbox" checked /> Sync generated images to cloud
    </label>
    <div class="row" style="margin-top:14px;">
      <button id="submit">Send to extension</button>
      <span id="msg" class="msg"></span>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px;">
      <h2 style="margin:0;">Jobs</h2>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th></th><th>Business</th><th>Prompts</th><th>Status</th><th>Added</th></tr></thead>
        <tbody id="jobs"><tr><td colspan="5" class="muted">Enter your license key to see jobs.</td></tr></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>Latest generated images</h2>
    <div id="results" class="gallery"><span class="muted">Nothing yet.</span></div>
  </section>
</main>

<script>
// Same project as the extension's cloud.js
const SUPABASE_URL = "https://qnttlpvskhbdxplxhkea.supabase.co";
const SUPABASE_KEY = "sb_publishable_FazEEXKHh0XW6Eik-F6zVw_rZJv4nvP";
const UPLOAD_BUCKET = "dashboard-uploads";

const $ = (id) => document.getElementById(id);
const H = (extra = {}) => ({ apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, ...extra });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const slug = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "item";
let file = null;

try { $("license").value = localStorage.getItem("dash_license") || ""; } catch {}
$("license").addEventListener("input", () => { try { localStorage.setItem("dash_license", $("license").value.trim()); } catch {} });

function setMsg(text, cls) { const m = $("msg"); m.textContent = text; m.className = "msg " + (cls || ""); }

// --- image picker ---
function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return setMsg("Please choose an image file", "err");
  file = f;
  $("preview").src = URL.createObjectURL(f); $("preview").hidden = false; $("drop-empty").hidden = true;
}
$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => setFile(e.target.files[0]));
["dragenter","dragover"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach((ev) => $("drop").addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => setFile(e.dataTransfer.files[0]));
$("label").addEventListener("input", () => { if (!$("folder").dataset.touched) $("folder").value = slug($("label").value); });
$("folder").addEventListener("input", () => { $("folder").dataset.touched = "1"; });

// --- submit ---
$("submit").addEventListener("click", async () => {
  const license = $("license").value.trim();
  const label = $("label").value.trim();
  const folder = $("folder").value.trim() || slug(label);
  const prompts = $("prompts").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  if (!license) return setMsg("License key is required", "err");
  if (!label) return setMsg("Business label is required", "err");
  if (!file) return setMsg("Add an image", "err");
  if (!prompts.length) return setMsg("Add at least one prompt", "err");

  $("submit").disabled = true; setMsg("Uploading image…");
  try {
    const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
    const path = `${slug(license)}/${Date.now()}-${slug(label)}.${ext}`;
    const up = await fetch(`${SUPABASE_URL}/storage/v1/object/${UPLOAD_BUCKET}/${path}`, {
      method: "POST",
      headers: H({ "Content-Type": file.type || "application/octet-stream", "x-upsert": "true" }),
      body: file,
    });
    if (!up.ok) throw new Error("Image upload failed: " + up.status + " " + await up.text());

    setMsg("Creating job…");
    const row = {
      license_key: license, business_label: label, save_folder: folder,
      logo_url: `${SUPABASE_URL}/storage/v1/object/public/${UPLOAD_BUCKET}/${path}`,
      logo_name: file.name, prompts, sync_to_cloud: $("sync").checked, status: "pending",
    };
    const ins = await fetch(`${SUPABASE_URL}/rest/v1/queue_jobs`, {
      method: "POST", headers: H({ "Content-Type": "application/json", Prefer: "return=minimal" }), body: JSON.stringify(row),
    });
    if (!ins.ok) throw new Error("Job insert failed: " + ins.status + " " + await ins.text());

    setMsg(`Sent “${label}” (${prompts.length} prompts). The extension will pick it up shortly.`, "ok");
    $("prompts").value = ""; $("label").value = ""; $("folder").value = ""; delete $("folder").dataset.touched;
    file = null; $("preview").hidden = true; $("drop-empty").hidden = false; $("file").value = "";
    loadJobs();
  } catch (e) { setMsg(e.message, "err"); }
  finally { $("submit").disabled = false; }
});

// --- jobs list ---
async function loadJobs() {
  const license = $("license").value.trim();
  if (!license) return;
  try {
    const q = new URLSearchParams({ license_key: "eq." + license, order: "created_at.desc", limit: "50", select: "*" });
    const r = await fetch(`${SUPABASE_URL}/rest/v1/queue_jobs?${q}`, { headers: H(), cache: "no-store" });
    if (!r.ok) throw new Error(r.status + " " + await r.text());
    const rows = await r.json();
    $("jobs").innerHTML = rows.length ? rows.map((j) => `
      <tr>
        <td><img src="${esc(j.logo_url)}" alt=""></td>
        <td><b>${esc(j.business_label)}</b><div class="muted">${esc(j.save_folder)}</div></td>
        <td>${(j.prompts || []).length}</td>
        <td><span class="pill ${esc(j.status)}">${esc(j.status)}</span>${j.error ? `<div class="muted">${esc(j.error)}</div>` : ""}</td>
        <td class="muted">${new Date(j.created_at).toLocaleString()}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="muted">No jobs yet.</td></tr>`;
  } catch (e) { $("jobs").innerHTML = `<tr><td colspan="5" class="msg err">Could not load jobs: ${esc(e.message)}</td></tr>`; }
}

// --- results gallery (reads rows the extension writes to generated_posts) ---
async function loadResults() {
  try {
    const q = new URLSearchParams({ status: "eq.success", order: "created_at.desc", limit: "24", select: "business_label,prompt,public_url" });
    const r = await fetch(`${SUPABASE_URL}/rest/v1/generated_posts?${q}`, { headers: H(), cache: "no-store" });
    if (!r.ok) return;
    const rows = (await r.json()).filter((x) => x.public_url);
    if (!rows.length) return;
    $("results").innerHTML = rows.map((x) => `
      <a href="${esc(x.public_url)}" target="_blank" rel="noopener">
        <img src="${esc(x.public_url)}" alt="" loading="lazy">
        <small>${esc(x.business_label || "")}</small>
      </a>`).join("");
  } catch {}
}

$("refresh").addEventListener("click", () => { loadJobs(); loadResults(); });
loadJobs(); loadResults();
setInterval(() => { loadJobs(); loadResults(); }, 10000);
</script>
</body>
</html>
